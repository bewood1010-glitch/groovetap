<!doctype html>
<!-- 앱 아이콘 원본. Playwright로 512px 스크린샷을 찍어 icons/에 저장한다 -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #0B0B0C; }
  #icon { width: 512px; height: 512px; position: relative; background: #0B0B0C; overflow: hidden; }
  .rec { position: absolute; left: 56px; top: 56px; width: 400px; height: 400px; border-radius: 50%;
    background: repeating-radial-gradient(circle, #1a1a1c 0 3px, #222225 3px 5px); }
  .label { position: absolute; left: 176px; top: 176px; width: 160px; height: 160px; border-radius: 50%; background: #FFB020; }
  .hole { position: absolute; left: 248px; top: 248px; width: 16px; height: 16px; border-radius: 50%; background: #0B0B0C; }
  .ring { position: absolute; border-radius: 50%; border: 10px solid #FFB020; }
  .r1 { left: 106px; top: 106px; width: 280px; height: 280px; opacity: .55; }
  .r2 { left: 56px; top: 56px; width: 380px; height: 380px; opacity: .25; }
</style>
<div id="icon"><div class="rec"></div><div class="ring r2"></div><div class="ring r1"></div><div class="label"></div><div class="hole"></div></div>
